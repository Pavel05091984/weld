<!doctype html>
<html>
  <script src="js/aframe.min.js"></script>
  <!-- мы импортируем версию arjs без NFT, но с поддержкой marker + location based -->
  <script src="js/aframe-ar.js"></script>

  <body>
    <a-scene eembedded arjs renderer="precision: medium;">
      <a-marker preset="hiro">
        <a-entity
          position="0 0 0"
          rotation="0 0 0"
          scale="10 10 10"
          gltf-model="model/тест.glb"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
